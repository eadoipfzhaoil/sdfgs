<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BnAi{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BnAi">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
:root{--bg:#0f1220;--card:#181c30;--line:#2a3050;--txt:#e8ebf7;--mut:#8f97b8;--acc:#6c7bff;--ok:#2fbf71;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,Vazirmatn,system-ui,sans-serif;line-height:1.7}
a{color:var(--acc);text-decoration:none}
nav{display:flex;gap:14px;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav .sp{flex:1}
main{max-width:980px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h1,h2,h3{margin:.2em 0 .6em}
input,textarea,select{width:100%;padding:10px 12px;background:#10142a;color:var(--txt);border:1px solid var(--line);border-radius:10px;font:inherit}
textarea{resize:vertical}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;display:inline-block}
button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.ok{background:var(--ok)} button.bad{background:var(--bad)}
.err{background:#3a1519;border:1px solid var(--bad);color:#ffb4b7;padding:10px;border-radius:10px;margin-bottom:12px}
.good{background:#10301f;border:1px solid var(--ok);color:#9ff0c2;padding:10px;border-radius:10px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.9em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
td input{padding:6px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{padding:2px 10px;border-radius:99px;background:#232a4d;font-size:.85em}
</style>
</head>
<body>
<nav>
  <b>🤖 BnAi</b>
  <button id="installBtn" class="ghost" style="display:none;padding:4px 12px">⬇️ نصب برنامه</button>
  {% if user %}
    <a href="/app">استودیو</a>
    <a href="/plans">💎 اشتراک</a>
    {% if user.is_admin %}<a href="/admin">🛠 مدیریت</a>{% endif %}
    <span class="sp"></span>
    <span class="mut">{{ user.email }} · {{ user.plan.name }}</span>
    <a href="/logout">خروج</a>
  {% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
let dp = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; document.getElementById('installBtn').style.display = 'inline-block'; });
document.getElementById('installBtn').onclick = async () => { if (!dp) return; dp.prompt(); await dp.userChoice; dp = null; document.getElementById('installBtn').style.display = 'none'; };
</script>
</body>
</html>
